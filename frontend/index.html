<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SupportGraph</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SupportGraph</h1>
        <p>Graph-powered technical issue troubleshooting</p>
    </header>


    <main>

        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search issues..."
            >

            <button id="searchButton">
                Search
            </button>

            <button id="showAllButton">
                Show All
            </button>

        </section>


        <!-- Issues -->
        <section>

            <h2>Issues</h2>

            <div id="issuesContainer">
                Loading issues...
            </div>

        </section>


        <!-- Issue Details -->
        <section id="detailsSection" class="hidden">

            <h2>Issue Details</h2>

            <div id="issueDetails"></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
